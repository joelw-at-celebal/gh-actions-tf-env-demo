name: 'Terraform Format Check'
on:
  workflow_dispatch:
jobs:
  terraform-format-check:
    name: 'Terraform Format Check'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
    - name: Terraform Format
      run: terraform fmt -check
